<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UKNOW - Profile</title>

    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --brand: #8c1515;
            --surface: rgba(255, 255, 255, 0.92);
            --border: #d4d8e2;
        }

        html, body {
            margin: 0;
            font-family: Tahoma;
            line-height: 1.5;
            height: 100%;
            color: var(--ink);
        }

        body {
            background-color: #f6f7fb;
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.18) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12vh 16px 8vh;
            box-sizing: border-box;
        }

        .profileCard {
            width: min(520px, 92vw);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 38px rgba(2, 6, 23, 0.12);
            padding: 28px 28px 24px;
            backdrop-filter: blur(6px);
            text-align: center;
        }

        h1 {
            margin: 0 0 6px;
            color: var(--brand);
            font-size: 2rem;
            font-weight: 600;
        }

        p {
            margin: 0 0 18px;
            color: var(--muted);
        }

        .logoutLink {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--brand);
            color: white;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(2, 6, 23, 0.12);
            transition: background 0.12s ease, transform 0.08s ease;
        }

        .logoutLink:hover {
            background: #c42f2f;
        }

        .logoutLink:active {
            transform: translateY(1px);
        }

        .headerRow {
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .logoLink {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: transparent;
            border: 0;
            padding: 0;
            cursor: pointer;
        }

        .siteLogo {
            height: 5vh;
            width: auto;
            display: block;
        }
        
    </style>
</head>
<body>
    <header>
        <div class="headerRow">
            <a class="logoLink" href="/">
                {% load static %}
                <img class="siteLogo" src="../../static/frontendapp/logo.png" alt="UKNOW logo">
            </a>
        </div>
    </header>
    
    <div class="page">
        <section class="profileCard">
            <h1>Profile</h1>
            <p>Signed in as {{ user.username }}.</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="logoutLink" type="submit">Log out</button>
            </form>
        </section>
    </div>
</body>
</html>
