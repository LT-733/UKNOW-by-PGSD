    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UKNOW</title>
        <style>
        body {
            margin: 0;
            font-family: Arial;
            line-height: 1.5;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            background: #102b66;
            color: #ffffff;
            padding: 4px;
            text-align: center;
            font-size: 20px;
            line-height: 0.15;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .subCon {
            margin: 0px auto 0px 500px;
            width: 1000px;
            display: flex;
            justify-content: center;
        }

        .subTitle {
            text-align: left;
            font-size: 25px;
            padding-top: 50px;
        }

        .textbox {
            display: block;
            width: 100%;
            max-width: 640px;
            margin: 24px auto;
            padding: 8px 12px;
            font-size: 20px;
        }
        .filterzz {
            max-width: 640px;
            margin: 16px auto;
            display: flex;
            gap: 40px;
            justify-content:center; 
            transform: scale(1.25);
        }
        .searchB {
            background:#3f4145;
            color: white;
            padding: 7px 14px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .searchB:hover {
            background:#4c4e53;
        }
        .searchB:active {
            transform: scale(0.95);
        }
        .homepageButton {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .homepageButton h1 {
            margin: 0;
        }

        </style>
    </head>
    <body>
        <header>
        <button class="homepageButton" onclick="window.location.href='/'"><h1>UKNOW</h1></button> 
        </header>
        <main>
        <div class="subCon">
            <div class="subTitle">
            </div>
        </div>

        <form method="get" action="/result">

            <input name="name" type="text" class="textbox" placeholder="Type the program name in here!">
            <div class="filterzz">
                <label>
                GPA:
                <input name="gpa" type="number" class="number-input" name="gpa" min="0" max="100" step="0.5" placeholder="67">
                </label>
                <label>
                &nbsp; &nbsp; University:
                <select name="uni" class="dropdown" name="university">sn
                    <option value="blank">select</option>
                    <option value="bye">yo im selection</option>
                </select>
                &nbsp; &nbsp; &nbsp; 
                </label>
                <label>
                <button class="searchB">SEARCH</button>
                </label>
            </div>

        </form>
        
        
        <!--
        <section class="features">
            {% for feature in features %}
            <div class="feature-card">
            <h2>Feature</h2>
            <p>{{ feature }}</p>
            </div>
            {% endfor %}
        </section>
        -->
        </main>
    </body>
    </html>
