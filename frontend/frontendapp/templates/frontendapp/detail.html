<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <title>UKNOW - detail</title>
        <style>
        body {
            margin: 0;
            font-family: Arial;
            line-height: 1.5;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            background: #102b66;
            color: #ffffff;
            padding: 4px;
            text-align: center;
            font-size: 20px;
            line-height: 0.15;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.9rem;
            color: #64748b;
        }
        .homepageButton {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .homepageButton h1 {
            margin: 0;
        }
        .headBack {
            color: black;
            text-decoration: none; 
            cursor: pointer;       
        }
        .headBack:hover {
            color: rgb(98, 98, 98);
        }
        .tables {
            display: flex;  
            align-items: flex-start;
            justify-content: center;
            width: 1000px;
            margin: 0 auto;
        }
        table.Logo {
            width: 200px;
        }
        table.info {
            width: 800px;
        }
        table {
            border-collapse: collapse;
        }
        td {
            text-align: left;
            padding: 8px;
        }
        </style>
    </head>
    <body>
        <header>
        <button class="homepageButton" onclick="window.location.href='/'"><h1>UKNOW</h1></button> 
        </header>
        <label>
            &nbsp;
        </label>
        <div class="tables">
            <table class="Logo">
                <tr><th></th></tr>
                <tr><td>&nbsp;</td></tr>
                <tr><td>&nbsp;</td></tr>
                <tr><td>{{ university }}</td></tr>
                <tr><td>&nbsp;</td></tr>
                <tr><td>&nbsp;</td></tr>
            </table>
            <table class="info">
                {% if university %}
                    <tr><td><strong>{{ university }}</strong></td></tr>
                {% endif %}
                {% if name %}
                    <tr><td>{{ name }}</td></tr>
                {% endif %}
                {% if description %}
                    <tr><td>{{ description }}</td></tr>
                {% endif %}
                {% if graph %}
                    <tr><td><img src="data:image/png;base64, {{graph|safe}}"></td></tr>
                {% endif %}
                {% if link %}
                    <tr><td style="text-align:right;"><a href="{{ link }}" target="_blank">program page</a></td></tr>
                {% endif %}
            </table>    
        </div>
    </body>
</html>
