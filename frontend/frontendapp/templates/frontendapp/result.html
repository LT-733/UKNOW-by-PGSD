<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UKNOW - result</title>
        <style>
        body {
            margin: 0;
            font-family: Arial;
            line-height: 1.5;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            background: #102b66;
            color: #ffffff;
            padding: 4px;
            text-align: center;
            font-size: 20px;
            line-height: 0.15;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.9rem;
            color: #64748b;
        }
        .homepageButton {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .homepageButton h1 {
            margin: 0;
        }
        .resultText {
            text-align: center;
            font-size: 25px;
            padding-top:25px;
        }
        table {
            border-collapse: collapse;
            overflow-x: scroll;
        }
        td {
            text-align: left;
            padding: 8px;
        }
        th {
            text-align: center;
            padding: 8px;
            border-bottom: 3px solid #4e0800;
        }
        .tables {
            display: flex;  
            align-items: flex-start;
            justify-content: center;
            border-left: 3px solid #4e0800;
            border-right: 3px solid #4e0800;
            width: 700px;
            margin: 0 auto;
        }
        .table64 {
            position: relative;

        }
        table.Logo {
            width: 200px;
        }
        table.Logo td {
            background-color: #acacac;
        }
        table.behind {
            position: absolute;
            z-index: 1;
            width: 500px
        }
        table.front {
            position: relative;
            z-index: 2;
            width: 500px;
        }
        table.front tr:nth-child(2) {
            background-color: #c2c2c2;
        }
        table.front tr:nth-child(3) {
            background-color: #d9d9d9;
        }
        
        </style>
    </head>
    <body>
        <header>
        <button class="homepageButton" onclick="window.location.href='/'"><h1>UKNOW</h1></button> 
        </header>
        <div class="resultText">
            <label>
                <b>Result</b>
            </label>
        </div>
        <div class="tables">
            <table class="Logo">
                <tr><th></th></tr>
                {% for row in results %}
                <tr><td>{{ row.university_name }}</td></tr>
                {% endfor %}
                <tr><th></th></tr>
            </table>
            <div class="table64">
                {% for row in results %}
                <table class="behind">
                    <tr><th></th><th></th></tr>
                    <tr style="line-height: 4"><td></td><td>&nbsp;</td></tr>
                    <tr><td></td><td>&nbsp;</td></tr>
                    <tr>
                        <td style="text-align:right;">Average GPA: {{ row.admission_average }}%</td>
                        <td style="text-align:center;">Risk: Match</td>
                    </tr>
                    <tr><th></th><th></th></tr>
                </table>
                <table class="front">
                    <tr><th></th></tr>
                    <tr>
                        <td style="line-height: 4">
                            <a href="/detail/?id={{ row.id }}" target="_blank">
                                <b>{{ row.program }}</b>
                            </a>
                        </td>
                    </tr>
                    <tr><td>{{ row.university_name }}</td></tr>
                </table>
                {% endfor %}
            </div>
        </div>
        
    </body>
</html>
